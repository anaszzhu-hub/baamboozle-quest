<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mission: Unlock Baamboozle</title>
<style>
  :root{
    --wood1:#9b4f1f;
    --wood2:#6e3314;
    --gold:#ffd43b;
    --gold2:#ffad00;
    --blue1:#08b7df;
    --blue2:#0b7fc6;
    --ink:#12304a;
    --green:#5bd53e;
    --red:#ff4d5d;
    --cream:#fff9ea;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
    background:
      radial-gradient(circle at 12% 14%, rgba(255,255,255,.25) 0 5%, transparent 6%),
      radial-gradient(circle at 80% 20%, rgba(255,255,255,.18) 0 5%, transparent 6%),
      linear-gradient(180deg,var(--blue2),var(--blue1) 58%,#6ce4e0 100%);
    color:white;
    overflow-x:hidden;
  }

  body::before, body::after{
    content:"";
    position:fixed;
    z-index:-1;
    width:300px;height:300px;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    filter:blur(35px);
  }
  body::before{left:-120px;top:18%}
  body::after{right:-140px;bottom:8%}

  .game{
    width:min(980px,100%);
    margin:0 auto;
    min-height:100vh;
    padding-bottom:36px;
  }

  .topbar{
    background:linear-gradient(#a95b25,#743514);
    border-bottom:4px solid rgba(67,28,8,.4);
    padding:12px 18px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:10px;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
    position:sticky;
    top:0;
    z-index:10;
  }
  .top-left,.top-right{
    display:flex;align-items:center;gap:12px;
  }
  .top-right{justify-content:flex-end}
  .stat{
    display:flex;align-items:center;gap:8px;
    font-size:clamp(18px,3vw,28px);
    font-weight:900;
    text-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  .coin,.heart,.gear{
    width:44px;height:44px;border-radius:50%;
    display:grid;place-items:center;
    border:3px solid rgba(255,255,255,.45);
    box-shadow:inset 0 3px 8px rgba(255,255,255,.2),0 3px 6px rgba(0,0,0,.25);
  }
  .coin{background:linear-gradient(#ffe65d,#ffb000); color:#8a4d00}
  .heart{background:linear-gradient(#ff6c7a,#e51f39)}
  .gear{background:linear-gradient(#59caff,#0c73bb)}
  .date{
    font-weight:900;
    font-size:clamp(14px,2.4vw,20px);
    text-align:center;
    color:#fff4cf;
    text-shadow:0 2px 0 rgba(0,0,0,.25);
    letter-spacing:.3px;
  }

  .hero{
    text-align:center;
    padding:26px 18px 12px;
  }
  .mission{
    margin:0 auto 12px;
    width:min(820px,96%);
    background:linear-gradient(#9f5324,#6d3212);
    border:5px solid #5c2a10;
    border-radius:24px;
    padding:14px 18px;
    box-shadow:0 10px 0 #4d240e,0 16px 20px rgba(0,0,0,.23);
  }
  .mission h1{
    margin:0;
    font-size:clamp(34px,7vw,70px);
    line-height:.95;
    color:white;
    -webkit-text-stroke:2px #0f5078;
    text-shadow:0 5px 0 #0c4669,0 8px 12px rgba(0,0,0,.2);
  }
  .mission h2{
    margin:8px 0 0;
    font-size:clamp(24px,5vw,52px);
    color:var(--gold);
    text-shadow:0 4px 0 #8b4a00;
  }
  .sub{
    display:inline-block;
    margin-top:14px;
    background:linear-gradient(#ac602e,#7b3a19);
    border:4px solid #5f2d13;
    border-radius:18px;
    padding:8px 20px;
    font-size:clamp(18px,3.2vw,28px);
    font-weight:900;
    box-shadow:0 6px 0 #4b220d;
  }

  .progress-wrap{
    width:min(760px,88%);
    margin:24px auto 10px;
  }
  .progress-label{
    display:flex;justify-content:space-between;align-items:center;
    font-weight:900;
    margin-bottom:7px;
    text-shadow:0 2px 0 rgba(0,0,0,.2);
  }
  .bar{
    height:22px;
    border-radius:20px;
    background:rgba(7,60,92,.42);
    border:3px solid rgba(255,255,255,.45);
    overflow:hidden;
    box-shadow:inset 0 3px 8px rgba(0,0,0,.25);
  }
  .fill{
    width:0%;
    height:100%;
    border-radius:20px;
    background:linear-gradient(90deg,#8df45f,#ffe24f);
    transition:width .45s ease;
  }

  .levels{
    width:min(760px,90%);
    margin:28px auto 18px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:28px 70px;
    position:relative;
  }

  .level{
    justify-self:center;
    width:clamp(132px,24vw,190px);
    aspect-ratio:1;
    border-radius:50%;
    border:none;
    cursor:pointer;
    position:relative;
    color:#fff8df;
    font-size:clamp(48px,10vw,76px);
    font-weight:900;
    background:
      radial-gradient(circle at 35% 30%,rgba(255,255,255,.12),transparent 36%),
      linear-gradient(145deg,#af622f,#7f3f1d 62%,#693214);
    box-shadow:
      inset 0 0 0 8px #bb6a37,
      inset 0 0 0 12px #713615,
      0 10px 0 #5b2a10,
      0 16px 20px rgba(0,0,0,.24);
    text-shadow:0 5px 0 #4a240f;
    transition:transform .2s ease,filter .2s ease;
  }
  .level:hover:not(.locked){transform:translateY(-4px) scale(1.03)}
  .level.locked{
    cursor:not-allowed;
    filter:saturate(.45) brightness(.72);
  }
  .level.locked::after{
    content:"🔒";
    position:absolute;
    inset:0;
    display:grid;place-items:center;
    font-size:50px;
    text-shadow:none;
  }
  .level.locked span{opacity:.18}
  .level.done{
    box-shadow:
      inset 0 0 0 8px #79dd45,
      inset 0 0 0 12px #2d8e28,
      0 10px 0 #2c7a27,
      0 16px 20px rgba(0,0,0,.24);
  }
  .level.done::after{
    content:"✓";
    position:absolute;
    right:-8px;bottom:-4px;
    width:58px;height:58px;border-radius:50%;
    display:grid;place-items:center;
    background:linear-gradient(#8df556,#2dcf34);
    color:white;
    font-size:40px;
    border:4px solid white;
    text-shadow:0 2px 0 rgba(0,0,0,.18);
    box-shadow:0 5px 8px rgba(0,0,0,.25);
  }
  .badge{
    position:absolute;
    top:8px;left:50%;
    transform:translate(-50%,-140%);
    background:rgba(10,58,89,.64);
    border:2px solid rgba(255,255,255,.45);
    border-radius:999px;
    padding:6px 12px;
    font-size:14px;
    white-space:nowrap;
    text-shadow:none;
  }

  .reward{
    width:min(700px,90%);
    margin:20px auto 0;
    text-align:center;
    padding:24px 20px 30px;
    background:rgba(6,71,107,.24);
    border:3px solid rgba(255,255,255,.22);
    border-radius:28px;
    backdrop-filter:blur(3px);
  }
  .chest{
    margin:0 auto 12px;
    width:min(340px,80vw);
    min-height:170px;
    border-radius:28px 28px 18px 18px;
    background:
      linear-gradient(90deg, transparent 0 13%,#f2b218 13% 18%,transparent 18% 82%,#f2b218 82% 87%,transparent 87%),
      linear-gradient(#a95a28 0 46%,#783719 47% 100%);
    border:7px solid #e7a511;
    box-shadow:0 10px 0 #7e4b08,0 0 34px rgba(255,225,70,.0);
    position:relative;
    display:grid;place-items:center;
    transition:.45s ease;
  }
  .chest::before{
    content:"🔒";
    font-size:62px;
    filter:drop-shadow(0 4px 0 rgba(0,0,0,.2));
  }
  .chest.unlocked{
    transform:translateY(-4px);
    box-shadow:0 10px 0 #7e4b08,0 0 50px rgba(255,232,88,.95);
  }
  .chest.unlocked::before{content:"🔓"}
  .reward-title{
    font-size:clamp(28px,5vw,48px);
    font-weight:1000;
    color:var(--gold);
    text-shadow:0 4px 0 #835000;
    margin:8px 0;
  }
  .reward p{
    font-size:clamp(16px,3vw,22px);
    margin:6px 0;
    font-weight:800;
  }

  .final-panel{
    display:none;
    margin-top:18px;
    animation:pop .4s ease;
  }
  @keyframes pop{
    from{transform:scale(.86);opacity:0}
    to{transform:scale(1);opacity:1}
  }
  .pin{
    display:inline-block;
    margin:8px 0 12px;
    padding:10px 18px;
    background:#fff;
    color:#113c5b;
    border-radius:14px;
    font-size:clamp(28px,6vw,44px);
    font-weight:1000;
    letter-spacing:4px;
    box-shadow:0 6px 0 rgba(0,0,0,.15);
  }
  .play{
    display:inline-block;
    text-decoration:none;
    background:linear-gradient(#8cf356,#31c936);
    color:white;
    font-size:clamp(22px,4vw,32px);
    font-weight:1000;
    padding:14px 26px;
    border-radius:16px;
    border:4px solid #208926;
    box-shadow:0 8px 0 #196d1e;
    text-shadow:0 2px 0 rgba(0,0,0,.2);
  }

  .reset{
    margin-top:18px;
    border:none;
    background:rgba(255,255,255,.16);
    color:white;
    font-weight:800;
    padding:10px 15px;
    border-radius:12px;
    cursor:pointer;
  }

  dialog{
    width:min(520px,90%);
    border:none;
    border-radius:24px;
    padding:0;
    box-shadow:0 24px 70px rgba(0,0,0,.45);
    background:#fff8e8;
    color:#15384e;
  }
  dialog::backdrop{background:rgba(0,31,49,.62)}
  .modal-head{
    background:linear-gradient(#a85a29,#713516);
    color:white;
    padding:18px 22px;
    text-align:center;
    font-size:28px;
    font-weight:1000;
  }
  .modal-body{padding:24px}
  .modal-body p{
    margin-top:0;
    text-align:center;
    font-size:18px;
    font-weight:800;
  }
  .code-row{display:flex;gap:10px}
  input{
    min-width:0;
    flex:1;
    padding:14px 16px;
    border-radius:14px;
    border:3px solid #b8d7e8;
    font-size:20px;
    outline:none;
    text-transform:lowercase;
  }
  input:focus{border-color:#19a4d5}
  .submit{
    border:none;
    border-radius:14px;
    padding:0 18px;
    background:linear-gradient(#ffdb43,#ffac00);
    color:#573500;
    font-size:18px;
    font-weight:1000;
    cursor:pointer;
    box-shadow:0 5px 0 #bd7600;
  }
  .feedback{
    min-height:28px;
    text-align:center;
    margin:18px 0 0;
    font-weight:1000;
    font-size:18px;
  }
  .ok{color:#209a32}
  .bad{color:#db2636}
  .close{
    display:block;
    margin:16px auto 0;
    border:none;
    background:#dcecf5;
    color:#24485d;
    border-radius:10px;
    padding:9px 16px;
    font-weight:900;
    cursor:pointer;
  }

  @media (max-width:600px){
    .topbar{grid-template-columns:1fr auto; padding:9px 10px}
    .date{grid-column:1/-1; grid-row:2; padding-top:4px}
    .top-right{display:none}
    .levels{gap:30px 34px}
    .badge{font-size:12px}
    .mission h1{-webkit-text-stroke:1px #0f5078}
  }
</style>
</head>
<body>
<div class="game">

  <header class="topbar">
    <div class="top-left">
      <div class="stat"><span class="coin">★</span><span id="score">0</span></div>
      <div class="stat"><span class="heart">♥</span><span>3</span></div>
    </div>
    <div class="date" id="today"></div>
    <div class="top-right">
      <div class="stat"><span class="gear">🏆</span></div>
      <div class="stat"><span class="gear">⚙</span></div>
    </div>
  </header>

  <section class="hero">
    <div class="mission">
      <h1>MISSION:</h1>
      <h2>UNLOCK BAAMBOOZLE</h2>
    </div>
    <div class="sub">Complete 6 tasks</div>
  </section>

  <div class="progress-wrap">
    <div class="progress-label">
      <span>MISSION PROGRESS</span>
      <span id="progressText">0 / 6</span>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

  <section class="levels" id="levels">
    <button class="level" data-level="1"><span>1</span><div class="badge">LEVEL 1</div></button>
    <button class="level locked" data-level="2"><span>2</span><div class="badge">LEVEL 2</div></button>
    <button class="level locked" data-level="3"><span>3</span><div class="badge">LEVEL 3</div></button>
    <button class="level locked" data-level="4"><span>4</span><div class="badge">LEVEL 4</div></button>
    <button class="level locked" data-level="5"><span>5</span><div class="badge">LEVEL 5</div></button>
    <button class="level locked" data-level="6"><span>6</span><div class="badge">LEVEL 6</div></button>
  </section>

  <section class="reward">
    <div class="chest" id="chest"></div>
    <div class="reward-title">BAAMBOOZLE</div>
    <p id="rewardText">Finish all 6 tasks to play!</p>

    <div class="final-panel" id="finalPanel">
      <p>BAAMBOOZLE UNLOCKED!</p>
      <div class="pin">190329</div><br>
      <a class="play" href="https://www.baamboozle.com/pin" target="_blank" rel="noopener">PLAY NOW</a>
    </div>

    <button class="reset" id="resetBtn">Reset progress</button>
  </section>
</div>

<dialog id="codeDialog">
  <div class="modal-head" id="modalTitle">LEVEL 1</div>
  <div class="modal-body">
    <p>Complete the task. Then enter the secret code.</p>
    <div class="code-row">
      <input id="codeInput" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Enter code">
      <button class="submit" id="submitCode">UNLOCK</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="close" id="closeDialog">Close</button>
  </div>
</dialog>

<script>
  const hashes = [
    "b58951d8a9c710e08d39322c6fabe22e55b900707ecf54d8d15e5aa08f645548",
    "f59e7a4ed324acd6be7a63946a097473b2cc3112c78f986934688077de077fe5",
    "03b6b3e9163de296faebe3502b998148ae0a756cbb82382a18622a4c19e1cbee",
    "4f9edc4d3ed0a0e5741a1f55b9a8f68efff6089dcc3009512eabd709c0d40bf1",
    "b5c755aaab1038b3d5627bbde7f47ca80c5f5c0481c6d33f04139d07aa1530e7",
    "6bf67200c28902770671846250c3018a55944c38fa1bbc363dbe12a61b508966"
  ];

  const STORAGE_KEY = "baamboozleMissionProgressV1";
  let completed = Number(localStorage.getItem(STORAGE_KEY) || 0);
  if (!Number.isInteger(completed) || completed < 0 || completed > 6) completed = 0;
  let activeLevel = null;

  const dialog = document.getElementById("codeDialog");
  const input = document.getElementById("codeInput");
  const feedback = document.getElementById("feedback");
  const score = document.getElementById("score");
  const fill = document.getElementById("fill");
  const progressText = document.getElementById("progressText");
  const chest = document.getElementById("chest");
  const finalPanel = document.getElementById("finalPanel");
  const rewardText = document.getElementById("rewardText");

  function setDate(){
    const d = new Date();
    const formatted = d.toLocaleDateString(undefined,{
      weekday:"short",
      day:"numeric",
      month:"short",
      year:"numeric"
    });
    document.getElementById("today").textContent = "TODAY • " + formatted.toUpperCase();
  }

  function render(){
    document.querySelectorAll(".level").forEach(btn=>{
      const level = Number(btn.dataset.level);
      btn.classList.remove("locked","done");

      if (level <= completed) {
        btn.classList.add("done");
      } else if (level > completed + 1) {
        btn.classList.add("locked");
      }
    });

    score.textContent = completed * 100;
    fill.style.width = (completed / 6 * 100) + "%";
    progressText.textContent = completed + " / 6";

    if (completed === 6){
      chest.classList.add("unlocked");
      finalPanel.style.display = "block";
      rewardText.textContent = "Reward unlocked!";
    } else {
      chest.classList.remove("unlocked");
      finalPanel.style.display = "none";
      rewardText.textContent = "Finish all 6 tasks to play!";
    }
  }

  async function sha256(text){
    const data = new TextEncoder().encode(text);
    const hashBuffer = await crypto.subtle.digest("SHA-256",data);
    return [...new Uint8Array(hashBuffer)]
      .map(b=>b.toString(16).padStart(2,"0"))
      .join("");
  }

  document.querySelectorAll(".level").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const level = Number(btn.dataset.level);
      if (btn.classList.contains("locked")) return;
      if (level <= completed) {
        feedback.className = "feedback ok";
        feedback.textContent = "✓ This level is already complete.";
      } else {
        feedback.className = "feedback";
        feedback.textContent = "";
      }
      activeLevel = level;
      document.getElementById("modalTitle").textContent = "LEVEL " + level;
      input.value = "";
      dialog.showModal();
      setTimeout(()=>input.focus(),100);
    });
  });

  async function checkCode(){
    if (!activeLevel) return;
    if (activeLevel <= completed){
      feedback.className = "feedback ok";
      feedback.textContent = "✓ This level is already complete.";
      return;
    }

    const value = input.value.trim().toLowerCase();
    if (!value){
      feedback.className = "feedback bad";
      feedback.textContent = "Enter the code first.";
      return;
    }

    const digest = await sha256(value);
    const expected = hashes[activeLevel - 1];

    if (digest === expected){
      completed = activeLevel;
      localStorage.setItem(STORAGE_KEY,String(completed));
      feedback.className = "feedback ok";
      feedback.textContent = "✓ CODE ACCEPTED! +100 POINTS";
      render();

      setTimeout(()=>{
        dialog.close();
        if (completed < 6) {
          const next = document.querySelector(`.level[data-level="${completed+1}"]`);
          next.animate(
            [{transform:"scale(1)"},{transform:"scale(1.12)"},{transform:"scale(1)"}],
            {duration:600,easing:"ease"}
          );
        }
      },850);
    } else {
      feedback.className = "feedback bad";
      feedback.textContent = "✕ WRONG CODE — complete the task first!";
      input.select();
    }
  }

  document.getElementById("submitCode").addEventListener("click",checkCode);
  input.addEventListener("keydown",e=>{
    if (e.key === "Enter") checkCode();
  });

  document.getElementById("closeDialog").addEventListener("click",()=>dialog.close());

  document.getElementById("resetBtn").addEventListener("click",()=>{
    if (confirm("Reset all progress?")){
      completed = 0;
      localStorage.removeItem(STORAGE_KEY);
      render();
    }
  });

  setDate();
  render();
</script>
</body>
</html>
